{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Культурный маршрут{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'agenda/site.css' %}">
</head>
<body>
  {% include "includes/nav.html" %}
  <main class="wrap main" id="main">
    {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer"><a class="brand" href="{% url 'agenda:home' %}">Культурный маршрут</a><span>Афиша и персональные рекомендации</span></footer>
</body>
</html>
