<div class="field">
  {% if field.use_fieldset %}<fieldset><legend>{{ field.label }}</legend>{% else %}{{ field.label_tag }}{% endif %}
  {{ field }}
  {% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
  {% if field.use_fieldset %}</fieldset>{% endif %}
</div>
