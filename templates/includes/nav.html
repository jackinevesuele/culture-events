<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{% url 'agenda:home' %}"><span aria-hidden="true" class="mark">✳</span> Культурный маршрут</a>
    <nav aria-label="Главное меню">
      <a href="{% url 'agenda:events' %}">Афиша</a>
      <a href="{% url 'agenda:interests' %}">Интересы</a>
      <a href="{% url 'agenda:recommendations' %}">Рекомендации</a>
      <a href="{% url 'agenda:stats' %}">Статистика</a>
    </nav>
    <div class="account">
      {% if request.user.is_authenticated %}
        <a class="text-link" href="{% url 'agenda:profile' %}">Профиль</a>
        <form method="post" action="{% url 'agenda:logout' %}">{% csrf_token %}<button class="button secondary" type="submit">Выйти</button></form>
      {% else %}
        <a class="button secondary" href="{% url 'agenda:login' %}">Войти</a>
      {% endif %}
    </div>
  </div>
</header>
